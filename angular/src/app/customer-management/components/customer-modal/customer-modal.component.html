<div class="modal-content">
  <div class="modal-header">
    <h5 class="modal-title">{{ isEdit ? 'Edit Customer' : 'Create Customer' }}</h5>
    <button type="button" class="btn-close" (click)="cancel()"></button>
  </div>
  
  <div class="modal-body">
    <form [formGroup]="form">
      <div class="mb-3">
        <label class="form-label required">Name</label>
        <input type="text" class="form-control" formControlName="name">
        <div *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="text-danger">
          Name is required
        </div>
      </div>
      
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" formControlName="email">
      </div>
      
      <div class="mb-3">
        <label class="form-label">Phone</label>
        <input type="tel" class="form-control" formControlName="phone">
      </div>
      
      <div class="mb-3">
        <label class="form-label">Billing Address</label>
        <textarea class="form-control" formControlName="billingAddress" rows="3"></textarea>
      </div>
    </form>
  </div>
  
  <div class="modal-footer d-flex">
  <button class="btn btn-secondary" (click)="cancel()" [disabled]="saving">
    Cancel
  </button>

  <div class="ms-auto">
    <button class="btn btn-primary" (click)="save()" [disabled]="form.invalid || saving">
      <span *ngIf="saving">Saving...</span>
      <span *ngIf="!saving">{{ isEdit ? 'Save' : 'Create' }}</span>
    </button>
  </div>
</div>

</div>
