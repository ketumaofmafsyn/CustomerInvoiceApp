<div class="card border-0 shadow-sm">
  <div class="card-header bg-white py-3">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">
      <h3 class="mb-0 fw-bold text-primary">
        <i class="fa fa-users me-2"></i>Customers
      </h3>
      
      <div class="d-flex flex-wrap gap-2 w-100 w-md-auto">
        <!-- Search Box -->
        <div class="input-group" style="max-width: 300px;">
          <input 
            type="text" 
            class="form-control" 
            placeholder="Search customers..." 
            [(ngModel)]="searchTerm"
            (keyup.enter)="onSearch(searchTerm)"
            [disabled]="isLoading">
          <button class="btn btn-outline-secondary" (click)="clearSearch()" [disabled]="!searchTerm">
            <i class="fa fa-times"></i>
          </button>
          <button class="btn btn-outline-primary" (click)="onSearch(searchTerm)" [disabled]="isLoading">
            <i class="fa fa-search"></i>
          </button>
        </div>
        
        <!-- New Customer Button -->
        <button 
          *abpPermission="permissions.hasCreate" 
          class="btn btn-primary"
          (click)="openCreateModal()"
          [disabled]="isLoading">
          <i class="fa fa-plus me-1"></i>New Customer
        </button>
      </div>
    </div>
  </div>

  <div class="card-body p-0">
    <!-- Loading Spinner -->
    <div *ngIf="isLoading" class="d-flex justify-content-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!isLoading && (!customers.items || customers.items.length === 0)" class="text-center py-5">
      <i class="fa fa-users fa-3x text-muted mb-3 d-block"></i>
      <p class="text-muted mb-3">
        {{ searchTerm ? 'No customers match your search' : 'No customers found' }}
      </p>
      <button *abpPermission="permissions.hasCreate" class="btn btn-primary" (click)="openCreateModal()">
        <i class="fa fa-plus me-1"></i>Create First Customer
      </button>
    </div>

    <!-- Customers Table -->
    <div *ngIf="!isLoading && customers.items?.length" class="table-responsive">
      <table class="table table-hover table-striped mb-0">
        <thead class="table-light">
          <tr>
            <th class="px-4 py-3 fw-bold">Name</th>
            <th class="px-4 py-3 fw-bold">Email</th>
            <th class="px-4 py-3 fw-bold">Phone</th>
            <th class="px-4 py-3 fw-bold text-center" style="min-width: 150px;">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of customers.items" class="align-middle">
            <td class="px-4 py-3">{{ item.name }}</td>
            <td class="px-4 py-3">
              <a [href]="'mailto:' + item.email" class="text-decoration-none text-primary">
                {{ item.email }}
              </a>
            </td>
            <td class="px-4 py-3">{{ item.phone || '—' }}</td>
            <td class="px-4 py-3 text-center">
              <div class="d-flex justify-content-center gap-1">
                <button class="btn btn-sm btn-outline-info" [routerLink]="['/customer-management/detail', item.id]">
                  <i class="fa fa-eye"></i>
                </button>
                <button *abpPermission="permissions.hasEdit" class="btn btn-sm btn-outline-warning" (click)="openEditModal(item)">
                  <i class="fa fa-edit"></i>
                </button>
                <button *abpPermission="permissions.hasDelete" class="btn btn-sm btn-outline-danger" (click)="deleteCustomer(item.id, item.name)">
                  <i class="fa fa-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
